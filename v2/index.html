<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Presently v2</title>
  <link rel="stylesheet" href="./app.css">
  <script type="importmap">
    {
      "imports": {
        "solid-js": "./vendor/solid-js/dist/solid.js",
        "solid-js/html": "./vendor/solid-js/html/dist/html.js",
        "solid-js/store": "./vendor/solid-js/store/dist/store.js",
        "solid-js/web": "./vendor/solid-js/web/dist/web.js"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    const params = new URLSearchParams(location.search);
    const screenId = params.get("screen");
    const testMode = params.has("test") && !screenId;
    const bootstrap = {
      testMode,
      screenId,
      storageKeys: {
        deck: `presently.v2.deck${testMode ? ".test" : ""}`,
        workspace: `presently.v2.workspace${testMode ? ".test" : ""}`,
        legacyDeck: "deck"
      },
      includeLegacy: !testMode
    };
    if (testMode) {
      window.TESTS_DONE = false;
      window.TESTS_FAILED = 0;
    }

    let mounted;
    let disposed = false;
    const dispose = () => {
      if (disposed) return;
      disposed = true;
      mounted?.dispose();
      if (testMode) window.presently = undefined;
    };

    try {
      const { createBrowserEnvironment, mount } = await import("./app.js");
      mounted = mount(document.querySelector("#app"), createBrowserEnvironment(), bootstrap);
      addEventListener("pagehide", event => {
        if (!event.persisted) dispose();
      });

      if (testMode && !bootstrap.screenId) {
        window.presently = mounted.app;
        try {
          const { runTests } = await import("./tests.js");
          window.TESTS_FAILED = Number(await runTests(mounted.app) || 0);
        } catch (error) {
          window.TESTS_FAILED = 1;
          console.error("Test bootstrap failed:", error);
        } finally {
          window.TESTS_DONE = true;
        }
      }
    } catch (error) {
      console.error("Presently failed to start:", error);
      if (testMode) {
        window.TESTS_FAILED = 1;
        window.TESTS_DONE = true;
      }
    }
  </script>
</body>
</html>
